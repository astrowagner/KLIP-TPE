name: tests
on: [push, pull_request]
jobs:
  # The quick suite on every push: unit tests and the short integration paths.  No `-x`, so
  # one failure does not hide the others -- a red run should list everything that is wrong.
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[plots,test]"
      - run: python -m pytest -q -m "not slow" --ignore=tests/test_backends.py --ignore=tests/test_integration_fm.py
  # The end-to-end searches (marked `slow`): real Runner runs on synthetic data, a few
  # minutes each.  One Python is enough; they exercise the protocol, not the interpreter.
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[plots,test]"
      - run: python -m pytest -q -m slow --durations=15 --ignore=tests/test_backends.py --ignore=tests/test_integration_fm.py
